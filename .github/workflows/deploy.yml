name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege at the top level. `pages: write` and `id-token: write` are
# granted to the deploy job ONLY: workflow-level permissions are inherited by
# every job, which would hand them to the job that runs `npm ci` — and so to
# every postinstall script in the dependency tree.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here needs the token afterwards, and leaving it in
          # .git/config exposes it to install scripts.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      # The OIDC handshake deploy-pages uses. No stored secret.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
# ONE-TIME SETUP: switch the repository's Pages source from "Deploy from a
# branch" to "GitHub Actions" (Settings -> Pages). Until that is done this
# workflow runs successfully and Pages keeps serving the old committed bundle.
